<!DOCTYPE html> 
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>會員註冊</title> 
    <style> 
        body { 
            margin: 0; 
            min-height: 100vh; 
            font-family: Arial, "Noto Sans TC", sans-serif; background: #f4f6f8; 
            display: grid; 
            place-items: center; 
            color: #1f2933; 
        }
        main {
            width: min(420px, calc(100vw - 32px));
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 32px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 0 24px;
            color: #52606d;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px 16px;
            border: 0;
            border-radius: 6px;
            background: #1769aa;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            display: none;
            margin: 0 0 16px;
            padding: 12px;
            border-radius: 6px;
            background: #e3f8ee;
            color: #0b6b3a;
        }

        .error {
            display: none;
            margin: 0 0 16px;
            padding: 12px;
            border-radius: 6px;
            background: #ffe3e3;
            color: #9b1c1c;
        }

        .link-row {
            margin-top: 16px;
            text-align: center;
        }

        a {
            color: #1769aa;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head> 
<body> 
<main> 
    <h1>會員註冊</h1> 
    <p>請輸入以下資料建立會員帳號。</p>
    <p id="message" class="message"></p>
    <p id="error" class="error"></p>

    <form id="registerForm">
        <label for="account">帳號</label>
        <input id="account" name="account" type="text" required>

        <label for="password">密碼</label>
        <input id="password" name="password" type="password" required>

        <label for="confirmPassword">確認密碼</label>
        <input id="confirmPassword" name="confirmPassword" type="password" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="name">姓名</label>
        <input id="name" name="name" type="text" required>

        <button id="registerButton" type="button">註冊會員</button>
    </form>

    <div class="link-row">
        <a href="/page/login">已有帳號？回登入頁</a>
    </div>
</main> 

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
<script> 
    $("#registerButton").on("click", function () { $("#message").hide(); 
    $("#error").hide(); 
    $("#registerButton").prop("disabled", true).text("註冊中"); 
    const account = $("#account").val().trim(); 
    const password = $("#password").val(); 
    const confirmPassword = $("#confirmPassword").val(); 
    const email = $("#email").val().trim(); 
    const name = $("#name").val().trim(); 
    if (!account || !password || !confirmPassword || !email || !name) { 
        $("#error").text("請填寫完整的註冊資料").show(); 
        $("#registerButton").prop("disabled", false).text("註冊會員"); return; 
    } 
    if (password !== confirmPassword) { 
        $("#error").text("兩次輸入的密碼不一致").show(); 
        $("#registerButton").prop("disabled", false).text("註冊會員"); 
        return; 
    } 
    const payload = { 
        account: account, password: password, email: email, name: name 
    }; 
    
    $.ajax({ 
        url: "/members/register", 
        method: "POST", 
        contentType: "application/json", 
        data: JSON.stringify(payload), 
        success: function (data) { 
            $("#message").text(data.message || "會員註冊成功").show(); 
            $("#registerForm")[0].reset(); 
        }, 
        error: function (xhr) { 
            const data = xhr.responseJSON || {}; 
            $("#error").text(data.message || "註冊失敗").show(); 
        }, 
        complete: function () { 
            $("#registerButton").prop("disabled", false).text("註冊會員"); 
            } 
        }); 
    }); 
</script> 
</body> 
</html>
