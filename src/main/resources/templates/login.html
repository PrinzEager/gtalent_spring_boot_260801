<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入</title>
    <style>
        body { margin: 0; min-height: 100vh; font-family: Arial, "Noto Sans TC", sans-serif; background: #f4f6f8; display: grid; place-items: center; color: #1f2933; }
        main { width: min(420px, calc(100vw - 32px)); background: #fff; border: 1px solid #d9e2ec; border-radius: 8px; padding: 32px; box-sizing: border-box; }
        h1 { margin: 0 0 24px; font-size: 28px; }
        label { display: block; margin: 16px 0 8px; font-weight: 700; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #bcccdc; border-radius: 6px; font-size: 16px; }
        button { width: 100%; margin-top: 24px; padding: 12px 16px; border: 0; border-radius: 6px; background: #1769aa; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
        button:disabled { cursor: wait; opacity: .7; }
        .error { display: none; margin: 0 0 16px; padding: 12px; border-radius: 6px; background: #ffe3e3; color: #9b1c1c; }
        .link-row { margin-top: 16px; text-align: right; }
        a { color: #1769aa; font-weight: 700; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<main>
    <h1>會員登入</h1>
    <p id="error" class="error" role="alert"></p>

    <form id="loginForm">
        <label for="account">帳號</label>
        <input id="account" name="account" type="text" autocomplete="username" required>

        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button id="loginButton" type="submit">登入</button>
    </form>
    <div class="link-row"><a href="/page/register">註冊會員</a></div>
    <div class="link-row"><a href="/page/forgot-password">忘記密碼？</a></div>
</main>

<script>
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("error");

    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        loginError.style.display = "none";
        if (!loginForm.checkValidity()) {
            loginForm.reportValidity();
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "登入中…";
        try {
            const response = await fetch("/members/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    account: document.getElementById("account").value.trim(),
                    password: document.getElementById("password").value
                })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.message || "登入失敗，請確認帳號與密碼。 ");
            }

            localStorage.setItem("accessToken", data.accessToken);
            localStorage.setItem("refreshToken", data.refreshToken);
            window.location.href = "/page/books";
        } catch (exception) {
            loginError.textContent = exception.message;
            loginError.style.display = "block";
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "登入";
        }
    });
</script>
</body>
</html>
